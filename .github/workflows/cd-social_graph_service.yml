name: CD Social Graph Service

on:
  push:
    branches: [ "main" ]
    paths:
      - "social_graph_service/**"
      - "libs/socialflux-events/**"
      - "pom.xml"
      - ".github/workflows/cd-social_graph_service.yml"
      - ".github/workflows/_spring-cd.yml"

concurrency:
  group: cd-social_graph_service
  cancel-in-progress: false

jobs:
  cd:
    uses: ./.github/workflows/_spring-cd.yml
    with:
      service: social_graph_service
      image: social_flux_social_graph_service
      compose_service: social_graph_service
    secrets: inherit
