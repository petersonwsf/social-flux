name: CD Post Service

on:
  push:
    branches: [ "main" ]
    paths:
      - "post_service/**"
      - "libs/socialflux-events/**"
      - "libs/socialflux-media/**"
      - "pom.xml"
      - ".github/workflows/cd-post_service.yml"
      - ".github/workflows/_spring-cd.yml"

concurrency:
  group: cd-post_service
  cancel-in-progress: false

jobs:
  cd:
    uses: ./.github/workflows/_spring-cd.yml
    with:
      service: post_service
      image: social_flux_post_service
      compose_service: post_service
    secrets: inherit
