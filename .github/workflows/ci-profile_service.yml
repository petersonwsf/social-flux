name: CI Profile Service

on:
  pull_request:
    paths:
      - "profile_service/**"
      - "libs/socialflux-events/**"
      - "libs/socialflux-media/**"
      - "pom.xml"
      - ".github/workflows/ci-profile_service.yml"
      - ".github/workflows/_spring-ci.yml"

concurrency:
  group: ci-profile_service-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/_spring-ci.yml
    with:
      service: profile_service
