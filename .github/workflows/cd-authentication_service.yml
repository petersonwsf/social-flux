name: CD Authentication Service

on:
  push:
    branches: [ "main" ]
    paths:
      - "authentication_service/**"
      - "libs/socialflux-events/**"
      - "pom.xml"
      - ".github/workflows/cd-authentication_service.yml"
      - ".github/workflows/_spring-cd.yml"

concurrency:
  group: cd-authentication_service
  cancel-in-progress: false

jobs:
  cd:
    uses: ./.github/workflows/_spring-cd.yml
    with:
      service: authentication_service
      image: social_flux_authentication_service
      compose_service: authentication_service
    secrets: inherit
