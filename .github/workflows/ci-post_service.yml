name: CI Post Service

on:
  pull_request:
    paths:
      - "post_service/**"
      - "libs/socialflux-events/**"
      - "libs/socialflux-media/**"
      - "pom.xml"
      - ".github/workflows/ci-post_service.yml"
      - ".github/workflows/_spring-ci.yml"

concurrency:
  group: ci-post_service-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/_spring-ci.yml
    with:
      service: post_service
