name: CI Social Graph Service

on:
  pull_request:
    paths:
      - "social_graph_service/**"
      - "libs/socialflux-events/**"
      - "pom.xml"
      - ".github/workflows/ci-social_graph_service.yml"
      - ".github/workflows/_spring-ci.yml"

concurrency:
  group: ci-social_graph_service-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/_spring-ci.yml
    with:
      service: social_graph_service
