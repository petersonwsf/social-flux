# CD de Notification Service: após o merge na main, repete os testes, publica a imagem no Docker Hub e atualiza a VPS.
name: CD Notification Service

on:
  push:
    branches: [ "main" ]

concurrency:
  group: cd-notification_service
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Testes pós-merge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Testes (inclui as libs/* usadas pelo serviço)
        run: mvn -B -ntp -pl notification_service -am test

  deploy_docker_hub:
    name: Imagem no Docker Hub
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Docker Setup Buildx
        uses: docker/setup-buildx-action@v3.11.1

      - name: Docker login
        uses: docker/login-action@v3.6.0
        with:
          username: ${{ secrets.USERNAME_DOCKER_HUB }}
          password: ${{ secrets.PASSWORD_DOCKER_HUB }}

      # O contexto é a RAIZ do repositório: o build inclui as bibliotecas compartilhadas (libs/*).
      - name: Build and push docker image
        uses: docker/build-push-action@v6.18.0
        with:
          context: .
          file: ./notification_service/Dockerfile
          push: true
          tags: |
            ${{ secrets.USERNAME_DOCKER_HUB }}/social_flux_notification_service:latest
            ${{ secrets.USERNAME_DOCKER_HUB }}/social_flux_notification_service:${{ github.sha }}

  deploy_vps:
    name: Deploy na VPS
    runs-on: ubuntu-latest
    needs: deploy_docker_hub
    steps:
      - name: Atualizar container na VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          script_stop: true
          script: |
            cd ${{ secrets.VPS_PROJECT_PATH }}
            docker compose pull notification_service
            docker compose up -d notification_service
            docker image prune -f
