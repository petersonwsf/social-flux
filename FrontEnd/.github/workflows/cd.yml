name: CD Frontend

on:
  push:
    branches: [ "main" ]

concurrency:
  group: cd-frontend
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Lint, tipos e build pós-merge
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.11.0"
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  deploy_docker_hub:
    name: Imagem no Docker Hub
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Docker Setup Buildx
        uses: docker/setup-buildx-action@v3.11.1

      - name: Docker login
        uses: docker/login-action@v3.6.0
        with:
          username: ${{ secrets.USERNAME_DOCKER_HUB }}
          password: ${{ secrets.PASSWORD_DOCKER_HUB }}

      - name: Build and push docker image
        uses: docker/build-push-action@v6.18.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          # Mesma origem via gateway: VITE_API_URL vazio (variáveis VITE_* são públicas, nunca segredos).
          build-args: |
            VITE_API_URL=
          tags: |
            ${{ secrets.USERNAME_DOCKER_HUB }}/social_flux_frontend:latest
            ${{ secrets.USERNAME_DOCKER_HUB }}/social_flux_frontend:${{ github.sha }}

  deploy_vps:
    name: Deploy na VPS
    runs-on: ubuntu-latest
    needs: deploy_docker_hub
    steps:
      - name: Atualizar container na VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          script_stop: true
          script: |
            cd ${{ secrets.VPS_PROJECT_PATH }}
            docker compose pull frontend
            docker compose up -d frontend
            docker image prune -f
